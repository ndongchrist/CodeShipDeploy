<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - GoldenBrain Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <style>
        :root {
            --primary: #facc15;
            --primary-dark: #eab308;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        
        .glassmorphism {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        
        .btn-primary {
            background-color: var(--primary);
            transition: all 0.2s ease;
        }
        
        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }
        
        .btn-primary:disabled {
            background-color: #d1d5db;
            cursor: not-allowed;
        }
        
        .floating-btn {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
        }
        
        .floating-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.5);
        }
        
        .error {
            border-color: #ef4444;
        }
        
        .error-message {
            color: #ef4444;
            font-size: 0.875rem;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="glassmorphism sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <span class="material-icons text-yellow-400 text-3xl">psychology</span>
                    <h1 class="text-2xl font-bold text-gray-900">GoldenBrain<span class="text-yellow-400">Shop</span></h1>
                </div>
                
                <div class="hidden md:flex items-center space-x-6">
                    <a href="index.html" class="text-gray-700 hover:text-yellow-400 transition">Home</a>
                    <a href="#" class="text-gray-700 hover:text-yellow-400 transition">Products</a>
                    <a href="#" class="text-gray-700 hover:text-yellow-400 transition">About</a>
                    <a href="#" class="text-gray-700 hover:text-yellow-400 transition">Contact</a>
                </div>
                
                <div class="flex items-center space-x-4">
                    <a href="checkout.html" class="relative cart-icon">
                        <span class="material-icons text-gray-700 hover:text-yellow-400 transition">shopping_cart</span>
                        <span class="absolute -top-2 -right-2 bg-yellow-400 text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center cart-count">0</span>
                    </a>
                    <button class="relative">
                        <span class="material-icons text-gray-700 hover:text-yellow-400 transition">favorite</span>
                    </button>
                    <button class="md:hidden">
                        <span class="material-icons text-gray-700">menu</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Product Details -->
    <main class="flex-grow container mx-auto px-4 py-12">
        <div class="bg-white rounded-xl shadow-md p-6">
            <div class="flex flex-col md:flex-row gap-8">
                <!-- Product Image -->
                <div class="md:w-1/2">
                    <img id="productImage" src="" alt="Product" class="w-full h-96 object-contain rounded-lg">
                </div>
                
                <!-- Product Info -->
                <div class="md:w-1/2">
                    <h2 id="productName" class="text-3xl font-bold text-gray-800 mb-4"></h2>
                    <div class="flex items-center mb-4">
                        <div class="flex text-yellow-400">
                            <span class="material-icons">star</span>
                            <span class="material-icons">star</span>
                            <span class="material-icons">star</span>
                            <span class="material-icons">star</span>
                            <span class="material-icons">star_half</span>
                        </div>
                        <span id="productReviews" class="text-gray-500 text-sm ml-2"></span>
                    </div>
                    <p id="productPrice" class="text-2xl font-bold text-gray-900 mb-4"></p>
                    <p id="productDescription" class="text-gray-600 mb-6"></p>
                    
                    <!-- Product Options -->
                    <form id="buyNowForm">
                        <div class="mb-4">
                            <label for="color" class="block text-sm font-medium text-gray-700 mb-1">Color</label>
                            <select id="color" class="w-full px-4 py-3
